name: Generar APK Vector Home

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" || true
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar Vector Home
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vector-Home-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
